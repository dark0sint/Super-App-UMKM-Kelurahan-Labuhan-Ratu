<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk - Super App UMKM Labuhan Ratu</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3a0d14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .login-wrap{min-height:100dvh; display:flex; flex-direction:column; justify-content:center; padding:28px 24px; max-width:420px; margin:0 auto;}
  .login-hero{text-align:center; margin-bottom:26px;}
  .login-hero .mark{width:64px; height:64px; margin:0 auto 14px;}
  .login-hero h1{font-size:22px; color:var(--marun-900); line-height:1.25;}
  .login-hero p{color:var(--tinta-600); font-size:13.5px; margin-top:6px;}
  .step{display:none;}
  .step.active{display:block;}
  .hint{font-size:12px; color:var(--tinta-600); margin-top:10px; text-align:center;}
  .otp-box{display:flex; gap:8px; margin-top:6px;}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-hero">
    <img src="/icon.svg" class="mark" alt="">
    <h1>Super App UMKM<br>Kelurahan Labuhan Ratu</h1>
    <p>Kecamatan Labuhan Ratu, Kota Bandar Lampung</p>
  </div>

  <div id="step-phone" class="step active card">
    <h3>Masuk dengan WhatsApp</h3>
    <label for="wa">Nomor WhatsApp</label>
    <input id="wa" type="tel" inputmode="numeric" placeholder="08xxxxxxxxxx" autocomplete="tel">
    <label for="name">Nama pemilik (untuk akun baru)</label>
    <input id="name" type="text" placeholder="Nama lengkap">
    <label for="biz">Nama usaha (untuk akun baru)</label>
    <input id="biz" type="text" placeholder="Contoh: Kripik Bu Sari">
    <button class="btn emas" style="margin-top:16px" onclick="requestOtp()">Kirim Kode OTP</button>
    <p class="hint">Tanpa perlu mengingat kata sandi — cukup nomor WhatsApp aktif.</p>
  </div>

  <div id="step-otp" class="step card">
    <h3>Masukkan Kode OTP</h3>
    <p class="hint" id="otp-target-hint"></p>
    <label for="otp">Kode OTP (6 digit)</label>
    <input id="otp" type="tel" inputmode="numeric" maxlength="6" placeholder="123456">
    <div id="demo-otp-box" style="display:none; background:var(--kertas-100); padding:10px; border-radius:8px; margin-top:10px; font-size:13px;"></div>
    <button class="btn emas" style="margin-top:16px" onclick="verifyOtp()">Masuk</button>
    <button class="btn outline" style="margin-top:10px" onclick="backToPhone()">Ganti nomor</button>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
let currentWa = '';

async function requestOtp(){
  const wa = document.getElementById('wa').value.trim();
  const name = document.getElementById('name').value.trim();
  const biz = document.getElementById('biz').value.trim();
  if (!wa){ toast('Isi nomor WhatsApp dulu ya.'); return; }
  try {
    const resp = await API.post('/api/auth/request-otp', { wa_number: wa, name, business_name: biz });
    currentWa = resp.wa_number;
    document.getElementById('otp-target-hint').textContent = `Kode dikirim ke WhatsApp ${currentWa}`;
    const demoBox = document.getElementById('demo-otp-box');
    if (resp.demo_otp){
      demoBox.style.display = 'block';
      demoBox.textContent = `Mode demo (belum ada gateway WA terpasang): kode OTP Anda adalah ${resp.demo_otp}`;
    } else {
      demoBox.style.display = 'none';
    }
    document.getElementById('step-phone').classList.remove('active');
    document.getElementById('step-otp').classList.add('active');
  } catch (e){
    toast(e.error || 'Gagal mengirim OTP.');
  }
}

async function verifyOtp(){
  const otp = document.getElementById('otp').value.trim();
  if (!otp){ toast('Masukkan kode OTP.'); return; }
  try {
    const resp = await API.post('/api/auth/verify-otp', { wa_number: currentWa, otp });
    API.setSession(resp.token, resp.user);
    toast('Berhasil masuk!');
    setTimeout(() => location.href = '/index.html', 400);
  } catch (e){
    toast(e.error || 'Kode OTP salah.');
  }
}

function backToPhone(){
  document.getElementById('step-otp').classList.remove('active');
  document.getElementById('step-phone').classList.add('active');
}

if (API.token()) location.href = '/index.html';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
</script>
</body>
</html>
